<!doctype html><html lang="ja"><head><base target="_top"><meta charset="utf-8"><style>
body{font-family:Arial,'Noto Sans JP',sans-serif;color:#202338;margin:0;padding:16px;font-size:14px}h2{margin:0 0 8px}button,input,select{font:inherit;padding:9px;border:1px solid #d5d5e5;border-radius:6px;background:white}button{cursor:pointer;color:#4036da}button:disabled{opacity:.5;cursor:default}.toolbar,.entry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.entry select{max-width:100%}#card{width:100%}#quantity{width:70px}.primary{background:#4036da;color:white}#status{min-height:24px;color:#555}#status.error{color:#b31d34}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.counts div{background:#f1f0ff;padding:10px;text-align:center;border-radius:6px}.counts strong{display:block;font-size:22px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd}th{background:#f4f4fa}.muted{font-size:12px;color:#737386}#retry{border-color:#b31d34}#pdf-link{display:inline-block;margin:8px;color:#4036da}[hidden]{display:none!important}
.search-results{display:grid;gap:6px;max-height:260px;overflow:auto;margin:8px 0}.search-result{text-align:left;display:flex;flex-direction:column;gap:4px}.search-result[aria-pressed="true"]{border:2px solid #4036da;background:#f1f0ff}.stepper{display:flex;align-items:center;gap:10px;white-space:nowrap}.stepper button{min-width:40px;min-height:40px;font-weight:bold}.selected-card{background:#f1f0ff;border-radius:8px;padding:12px;margin:8px 0}#search{box-sizing:border-box}#card{display:none}.stepper input{width:76px;text-align:center;box-sizing:border-box}.stepper{flex-wrap:wrap}</style></head><body>
<h2>共有の買取記録</h2><p class="muted">全員で同じ枚数を共有します。日付は日本時間。訂正は「枚数を減らす」で記録します。</p>
<div class="toolbar"><label>集計日 <input id="day" type="date"></label><button id="today">本日</button><button id="reload">更新</button></div>
<div id="status" role="status">接続中…</div><button id="retry" hidden>未確認の操作を同じIDで再確認</button>
<label>カードを検索 <input id="search" type="search" placeholder="例：いーぶい ／ 173165 ／ ピカチュウ 151" style="width:100%"></label><select id="card" aria-label="買取するカード"></select>
<div id="search-results" class="search-results" aria-label="カードの検索候補"></div><p id="search-hint" class="muted"></p><div id="selected-card" class="selected-card"></div><div id="counts" class="counts"></div>
<div class="entry"><label>PSA <select id="grade"><option>10</option><option>9</option><option>8</option></select></label><label>枚数 <input id="quantity" type="number" min="0" max="1000" step="1" value="0"></label><button id="add" class="primary" disabled>買取枚数を追加</button><button id="subtract" disabled>枚数を減らす</button></div>
<p class="muted">本日の枚数は数字を直接入力して「保存」またはEnterで確定できます。−／＋も未保存の枚数だけを変更します。保存するまで共有・PDFには反映されません。過去日・期間集計は閲覧用です。</p><h3 id="total">この日の買取一覧</h3><div class="table-wrap"><table><thead><tr><th>カード名</th><th>型番・収録弾</th><th>PSA</th><th>枚数</th></tr></thead><tbody id="rows"></tbody></table></div>
<hr><h3>期間を指定して買取リストを出力</h3><p class="muted">開始日・終了日の両方を含みます。PSA10 → 9 → 8、各グレード内は名前順。</p>
<div class="toolbar"><label>開始日 <input id="range-start" type="date"></label><label>終了日 <input id="range-end" type="date"></label><button id="range-show">一覧を表示</button><button id="pdf" disabled>指定期間のPDFを作成</button><a id="pdf-link" hidden>PDFを保存</a></div>
<p id="range-status" role="status">期間を指定してください。</p><div class="table-wrap"><table><thead><tr><th>カード名</th><th>型番・収録弾</th><th>PSA</th><th>枚数</th></tr></thead><tbody id="range-rows"></tbody></table></div>
<script>
const bridgeNonce='<?!= bridgeNonce ?>',hostOrigin='https://m0ch4771.github.io';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localToday=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());
let followToday=true, optimistic=false, rangeBusy=false, rangeSeq=0;
let cards=[],summary=null,pending=null,busy=false,reading=false,seq=0,pdfUrl='',queuedCard='';
const pendingKey='alt-purchase-pending-v1';
function status(text,error=false){window.top.postMessage({type:'alt-purchase-feedback',nonce:bridgeNonce,text},hostOrigin);$('status').textContent=text;$('status').className=error?'error':'';}
function call(name,arg){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg);});}
function persist(){try{if(pending)sessionStorage.setItem(pendingKey,JSON.stringify(pending));else sessionStorage.removeItem(pendingKey);}catch{}}
function buttons(){const disabled=busy||!!pending||!summary||$('day').value!==summary.today||!$('card').value;$('add').disabled=disabled;$('subtract').disabled=disabled;$('retry').hidden=!pending;$('retry').disabled=busy;document.querySelectorAll('[data-step],[data-row-quantity],[data-row-save]').forEach(b=>b.disabled=busy||!!pending||!summary||summary.day!==localToday());$('pdf').disabled=busy||!!pending||rangeBusy||!$('range-start').value||!$('range-end').value;$('range-show').disabled=busy||!!pending||rangeBusy;window.top.postMessage({type:'alt-purchase-controls',nonce:bridgeNonce,batch:true,ack:true,blocked:busy||!!pending||!summary},hostOrigin);}
function render(){
 if(!summary)return;
 $('total').textContent=summary.day+' の買取一覧：合計 '+summary.total+'枚';
 const drafts=new Map([...$('rows').querySelectorAll('[data-row-quantity]')].filter(el=>el.value!==el.dataset.base||el===document.activeElement).map(el=>[el.dataset.day+'|'+el.dataset.card+'|'+el.dataset.grade,{value:el.value,base:el.dataset.base,focused:el===document.activeElement}]));
 $('rows').innerHTML=summary.items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.number)+'<br>'+esc(x.set)+'</td><td>'+esc(x.grade)+'</td><td><div class="stepper"><button type="button" data-step="-1" data-card="'+esc(x.id)+'" data-grade="'+esc(x.grade)+'" aria-label="'+esc(x.name)+' PSA '+esc(x.grade)+' を1枚減らす">−</button><input type="number" min="0" step="1" inputmode="numeric" data-row-quantity data-day="'+esc(summary.day)+'" data-card="'+esc(x.id)+'" data-grade="'+esc(x.grade)+'" data-base="'+x.quantity+'" value="'+x.quantity+'" aria-label="'+esc(x.name)+' PSA '+esc(x.grade)+' 本日の買取枚数"><span>枚</span><button type="button" data-step="1" data-card="'+esc(x.id)+'" data-grade="'+esc(x.grade)+'" aria-label="'+esc(x.name)+' PSA '+esc(x.grade)+' を1枚増やす">＋</button><button type="button" data-row-save>保存</button></div></td></tr>').join('')||'<tr><td colspan="4">この日の買取記録はありません</td></tr>';
 $('rows').querySelectorAll('[data-row-quantity]').forEach(el=>{const draft=drafts.get(summary.day+'|'+el.dataset.card+'|'+el.dataset.grade);if(draft){el.value=draft.value;el.dataset.base=draft.base;if(draft.focused)el.focus();}markRowDraft(el);});
 $('counts').innerHTML=['10','9','8'].map(g=>{const item=summary.items.find(x=>x.id===$('card').value&&x.grade===g);return '<div>PSA '+g+'<strong>'+(item?.quantity||0)+'枚</strong><small>累計 '+(summary.cumulative?.find(x=>x.id===$('card').value&&x.grade===g)?.quantity||0)+'枚</small></div>';}).join('');
 const selected=cards.find(c=>c.id===$('card').value);$('selected-card').textContent=selected?'選択中：'+selected.name+' '+selected.number+' ／ '+selected.set:'検索候補からカードを選択してください';
 buttons();window.top.postMessage({type:'alt-purchase-summary',nonce:bridgeNonce,summary,optimistic:optimistic?(pending.batch||pending):null},hostOrigin);
}
function normalizeSearch(value){return String(value||'').normalize('NFKC').toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));}
function searchCards(cards,query){const words=normalizeSearch(query).trim().split(/\s+/).filter(Boolean);return cards.filter(c=>{const text=normalizeSearch(c.name+' '+c.number+' '+c.set),number=normalizeSearch(c.number).replace(/[^0-9a-z]/g,'');return words.every(w=>text.includes(w)||number.includes(w.replace(/[/／]/g,'')));}).sort((a,b)=>{const q=normalizeSearch(query).trim();return Number(normalizeSearch(b.name)===q)-Number(normalizeSearch(a.name)===q)||a.name.localeCompare(b.name,'ja')||a.number.localeCompare(b.number);});}
function options(){
 const value=queuedCard||$('card').value,filtered=searchCards(cards,$('search').value);queuedCard='';
 $('card').innerHTML='<option value="">選択してください</option>'+cards.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name+' '+c.number+' / '+c.set)+'</option>').join('');$('card').value=cards.some(c=>c.id===value)?value:'';
 $('search-results').innerHTML=filtered.slice(0,30).map(c=>'<button type="button" class="search-result" data-select-card="'+esc(c.id)+'" aria-pressed="'+(c.id===value)+'"><strong>'+esc(c.name)+'</strong><small>'+esc(c.number+' ／ '+c.set)+'</small></button>').join('');
 $('search-hint').textContent=filtered.length?(filtered.length+'件'+(filtered.length>30?'・先頭30件を表示。名前・型番・収録弾で絞り込めます。':'')):'一致するカードがありません。名前や型番を短くしてお試しください。';render();
}
$('search-results').onclick=e=>{const b=e.target.closest('[data-select-card]');if(!b)return;$('card').value=b.dataset.selectCard;options();};
$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const matches=searchCards(cards,$('search').value);if(matches.length===1){$('card').value=matches[0].id;options();}}};
function rowDelta(value,base){if(String(value).trim()===''||!Number.isSafeInteger(Number(value))||Number(value)<0)throw Error('枚数は0以上の整数で入力してください');const delta=Number(value)-Number(base);if(!Number.isSafeInteger(delta)||Math.abs(delta)>1000)throw Error('一度の変更は増減1000枚以内で指定してください');return delta;}
function saveRow(input,step){
 if(busy||pending||!summary||summary.day!==localToday())return;
 let delta;try{delta=rowDelta(input.value,input.dataset.base)+(step||0);if(Math.abs(delta)>1000||Number(input.value)+(step||0)<0)throw Error('変更する枚数を確認してください');}catch(e){status(e.message,true);return;}
 if(!delta){status('枚数の変更はありません');return;}
 pending={id:crypto.randomUUID(),day:summary.day,cardId:input.dataset.card,grade:input.dataset.grade,delta,revision:''};
 input.value=input.dataset.base;input.blur();persist();optimistic=true;seq++;render();send();
}
function adjustRow(input,step){
 if(busy||pending||!summary||summary.day!==localToday())return;
 try{
  if(input.value.trim()==='')throw Error('枚数を入力してください');
  const next=Number(input.value)+step;rowDelta(String(next),input.dataset.base);
  input.value=String(next);markRowDraft(input);
 }catch(e){status(e.message,true);}
}
function markRowDraft(input){const button=input.closest('.stepper').querySelector('[data-row-save]');button.textContent=input.value!==input.dataset.base?'保存（未保存）':'保存';}
$('rows').oninput=e=>{if(e.target.matches('[data-row-quantity]'))markRowDraft(e.target);};
$('rows').onclick=e=>{const b=e.target.closest('[data-step],[data-row-save]');if(!b)return;const input=b.closest('.stepper').querySelector('[data-row-quantity]');if(b.hasAttribute('data-step'))adjustRow(input,Number(b.dataset.step));else saveRow(input,0);};
$('rows').onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('[data-row-quantity]')){e.preventDefault();saveRow(e.target,0);}};

function setCard(id){if(!cards.length){queuedCard=id;return;}$('search').value='';queuedCard=id;options();}
window.addEventListener('message',e=>{if(e.origin===hostOrigin&&e.source===window.top&&e.data?.nonce===bridgeNonce&&e.data.type==='alt-purchase-select')setCard(String(e.data.id||''));});

window.addEventListener('message',async e=>{
 if(e.origin!==hostOrigin||e.source!==window.top||e.data?.nonce!==bridgeNonce||e.data.type!=='alt-purchase-add')return;
 const {cardId,grade,quantity,revision}=e.data;
 if(busy||pending){status('前の操作を確認中です。「買取を記録・PDF」で確認してください。',true);buttons();return;}
 if(!summary||!cards.some(c=>c.id===cardId)||!['8','9','10'].includes(grade)||!Number.isInteger(quantity)||quantity<1||quantity>1000){status('追加内容を確認できません。更新して再度お試しください。',true);buttons();return;}
 followToday=true;seq++;$('day').value=localToday();setCard(cardId);$('grade').value=grade;$('quantity').value=quantity;add(1,revision);
});


window.addEventListener('message',e=>{
 if(e.origin!==hostOrigin||e.source!==window.top||e.data?.nonce!==bridgeNonce||e.data.type!=='alt-purchase-batch')return;
 if(busy||pending){status('前の保存を確認中です。',true);buttons();return;}
 const entries=e.data.entries;
 if(!summary||!Array.isArray(entries)||!entries.length||entries.length>2000||
 entries.some(x=>!cards.some(c=>c.id===x.cardId)||!['8','9','10'].includes(x.grade)||!Number.isInteger(x.quantity)||x.quantity<1||x.quantity>1000)){
  status('一括追加の内容を確認してください。保存していません。',true);buttons();return;
 }
 followToday=true;$('day').value=localToday();
 pending={batch:entries.map(x=>({id:crypto.randomUUID(),day:$('day').value,cardId:x.cardId,grade:x.grade,delta:x.quantity,revision:x.revision||''}))};
 persist();optimistic=true;seq++;render();send();
});

async function refresh(){if(reading||busy||pending||!$('day').value)return;if(followToday&&$('day').value!==localToday()){$('day').value=localToday();summary=null;buttons();}reading=true;const request=++seq,day=$('day').value;try{const next=await call('purchaseList',day);if(request===seq&&day===$('day').value){summary=next;render();if(!pending)status('共有データ更新：'+new Date(next.updatedAt).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'}));}}catch(e){status('共有データを確認できません。'+e.message,true);}finally{reading=false;}}
async function send(){if(!pending||busy)return;busy=true;seq++;buttons();status('枚数を反映しました。共有先に保存中…');const operation=pending;let timer=setTimeout(()=>status('応答を待っています。新しい操作として追加せず、そのままお待ちください。',true),20000);try{const result=await call(operation.batch?'purchaseBatch':'purchaseAdd',operation.batch||operation);if(result.ok){window.top.postMessage({type:'alt-purchase-saved',nonce:bridgeNonce,operations:operation.batch||[operation]},hostOrigin);$('quantity').value=0;optimistic=false;pending=null;persist();clearRange();summary=result.summary;$('day').value=summary.day;render();status(result.replayed?'保存済みの操作を確認しました（二重加算なし）':'共有の買取枚数を保存しました');}else{if(result.retryable===false){optimistic=false;pending=null;persist();render();}status(result.error,true);}}catch(e){status('保存できたか未確認です。「再確認」で同じ操作を確認してください。 '+e.message,true);}finally{clearTimeout(timer);busy=false;buttons();}}
function add(sign,revision){if(pending||busy)return;const quantity=Number($('quantity').value);if(!Number.isInteger(quantity)||quantity<1||quantity>1000){status('枚数は1〜1000の整数で入力してください',true);return;}pending={id:crypto.randomUUID(),day:$('day').value,cardId:$('card').value,grade:$('grade').value,delta:sign*quantity,revision:revision||''};persist();optimistic=true;seq++;render();send();}
$('add').onclick=()=>add(1);$('subtract').onclick=()=>add(-1);$('retry').onclick=send;$('reload').onclick=refresh;
$('today').onclick=()=>{followToday=true;$('day').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());summary=null;buttons();refresh();};
$('day').onchange=()=>{followToday=$('day').value===localToday();seq++;summary=null;$('pdf').disabled=true;buttons();refresh();};$('search').oninput=options;$('card').onchange=render;
function selectedRange(){const start=$('range-start').value,end=$('range-end').value;if(!start||!end||start>end)throw Error('開始日と終了日を正しく指定してください');return {start,end};}
function clearRange(){rangeSeq++;$('pdf-link').hidden=true;if(pdfUrl){URL.revokeObjectURL(pdfUrl);pdfUrl='';}$('range-rows').innerHTML='';$('range-status').textContent='「一覧を表示」または「指定期間のPDFを作成」を押してください。';buttons();}
$('range-start').onchange=clearRange;$('range-end').onchange=clearRange;
async function rangeAction(pdfMode){
 if(rangeBusy||busy||pending)return;
 let range;try{range=selectedRange();}catch(e){$('range-status').textContent=e.message;return;}
 rangeBusy=true;const request=++rangeSeq;$('pdf-link').hidden=true;buttons();$('range-status').textContent=pdfMode?'PDFを作成中…':'指定期間を集計中…';
 try{
  const result=await call(pdfMode?'purchasePdf':'purchaseRange',range);if(request!==rangeSeq)return;
  if(pdfMode){const bytes=Uint8Array.from(atob(result.base64),c=>c.charCodeAt(0));if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));$('pdf-link').href=pdfUrl;$('pdf-link').download=result.name;$('pdf-link').hidden=false;$('range-status').textContent=range.start+' 〜 '+range.end+' のPDFを作成しました。「PDFを保存」を押してください。';}
  else{$('range-status').textContent=result.start+' 〜 '+result.end+'：合計 '+result.total+'枚（取得時点）';$('range-rows').innerHTML=result.items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.number)+'<br>'+esc(x.set)+'</td><td>PSA '+esc(x.grade)+'</td><td>'+x.quantity+'</td></tr>').join('')||'<tr><td colspan="4">指定期間の買取記録はありません</td></tr>';}
 }catch(e){if(request===rangeSeq)$('range-status').textContent='取得できません。'+e.message;}finally{rangeBusy=false;buttons();}
}
$('range-show').onclick=()=>rangeAction(false);$('pdf').onclick=()=>rangeAction(true);
$('range-start').value=localToday();$('range-end').value=localToday();
async function boot(){try{try{pending=JSON.parse(sessionStorage.getItem(pendingKey)||'null');}catch{}const result=await call('purchaseBootstrap');cards=result.cards;summary=result.summary;$('day').value=summary.day;options();render();status(pending?'前回の未確認操作があります。「再確認」を押してください。':'共有の買取記録に接続しました');window.top.postMessage({type:'alt-purchase-ready',nonce:bridgeNonce,inline:true,batch:true,ack:true},hostOrigin);}catch(e){status('接続できません。'+e.message,true);}}
setInterval(()=>{if(!document.hidden)refresh();},3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});boot();
</script></body></html>
