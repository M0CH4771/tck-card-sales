name: ALT public refresh
on:
  schedule:
    - cron: '0 15 * * *' # 00:00 Asia/Tokyo; GitHub scheduling can be delayed.
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe: 1 card / full: all cards and save'
        required: true
        default: probe
        type: choice
        options: [probe, full]
  push:
    branches: [main]
    paths:
      - '.github/workflows/alt-refresh.yml'
      - 'scripts/cloud-run.mjs'
      - 'scripts/local-scrape.mjs'
      - 'scripts/read-public-page.mjs'
      - 'scripts/public-match.mjs'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: alt-public-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: write
    env:
      ALT_MODE: ${{ github.event_name == 'schedule' && 'full' || github.event_name == 'workflow_dispatch' && inputs.mode || 'probe' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Read public ALT pages
        id: scrape
        continue-on-error: true
        run: xvfb-run --auto-servernum node scripts/cloud-run.mjs
      - name: Save run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alt-refresh-report
          path: .local-runs/**/report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit daily data and status
        if: env.ALT_MODE == 'full' && steps.scrape.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/data.json dist/sync-status.json scripts/targets.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public ALT sales and run status'
            git push origin HEAD:main
          fi
      - name: Report zero-result failure
        if: steps.scrape.outcome == 'failure'
        run: |
          echo 'ALT retrieval failed. Previous prices remain unchanged. Check the report artifact.'
          exit 1
