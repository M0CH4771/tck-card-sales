name: Publish PSA comparison and JPY display
on:
  push:
    branches: ['ui/psa-comparison-jpy']
permissions:
  contents: write
# Wait for the running scraper to commit its results before changing main.
concurrency:
  group: alt-public-refresh
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the prepared UI change
        env:
          UI_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick --no-commit "$UI_COMMIT"
          node --check dist/app.mjs
          node --test scripts/core.test.mjs scripts/public-page.test.mjs scripts/comparison.test.mjs
          git commit -m 'Show PSA 8, 9 and 10 together with JPY estimates'
          git push origin HEAD:main
